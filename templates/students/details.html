{% extends "layouts/base.html" %}

{% block title %}Student Details{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-lg border-0">

        <div class="card-header bg-primary text-white">

            <h2>
                👨 Student Details
            </h2>

        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <tr>
                    <th>Roll Number</th>
                    <td>{{ s.roll }}</td>
                </tr>

                <tr>
                    <th>Name</th>
                    <td>{{ s.name }}</td>
                </tr>

                <tr>
                    <th>Math</th>
                    <td>{{ s.math }}</td>
                </tr>

                <tr>
                    <th>Science</th>
                    <td>{{ s.science }}</td>
                </tr>

                <tr>
                    <th>English</th>
                    <td>{{ s.english }}</td>
                </tr>

                <tr>
                    <th>Average</th>
                    <td>{{ s.average }}</td>
                </tr>

                <tr>
                    <th>Grade</th>
                    <td>{{ s.grade }}</td>
                </tr>

            </table>

            <a href="/" class="btn btn-secondary">

                ← Back

            </a>

        </div>

    </div>

</div>

{% endblock %}
