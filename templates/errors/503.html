{% extends "layouts/base.html" %}
{% block title %}Temporarily Unavailable | EduTrack{% endblock %}
{% block content %}
<main class="container py-5 text-center">
  <div class="display-1 fw-bold text-warning"><i class="bi bi-database-exclamation"></i></div>
  <h1 class="h3 mt-3">Service temporarily unavailable</h1>
  <p class="text-muted">EduTrack cannot reach the database right now. Your request was not completed. Please wait a moment and try again.</p>
  <a class="btn btn-primary mt-2" href="{{ url_for('index') }}">Try again</a>
</main>
{% endblock %}
